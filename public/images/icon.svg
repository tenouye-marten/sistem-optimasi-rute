<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="iconGlobe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="iconShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Container -->
  <circle cx="100" cy="100" r="95" fill="url(#iconGlobe)" stroke="#14532d" stroke-width="5"/>

  <!-- Hands / Eco Base -->
  <path d="M 40 120 C 35 90, 65 95, 80 120 C 90 135, 100 150, 100 160 C 100 150, 110 135, 120 120 C 135 95, 165 90, 160 120 C 150 155, 120 165, 100 175 C 80 165, 50 155, 40 120 Z" fill="#14532d" opacity="0.9"/>

  <!-- Center Shield Emblem -->
  <path d="M 100 40 C 130 40, 140 52, 140 85 C 140 115, 120 130, 100 140 C 80 130, 60 115, 60 85 C 60 52, 70 40, 100 40 Z" fill="url(#iconShield)" stroke="#ffffff" stroke-width="3"/>
  <path d="M 100 45 C 126 45, 134 56, 134 85 C 134 110, 117 123, 100 132 C 83 123, 66 110, 66 85 C 66 56, 74 45, 100 45 Z" fill="none" stroke="url(#iconGold)" stroke-width="2"/>

  <!-- Tugu Center Symbol -->
  <rect x="93" y="60" width="14" height="48" rx="2" fill="#ffffff"/>
  <text x="100" y="74" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3E</text>
  <text x="100" y="86" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3E</text>
  <text x="100" y="98" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3E</text>

  <!-- Red Ribbon -->
  <rect x="75" y="112" width="50" height="12" rx="2" fill="#dc2626"/>
  <text x="100" y="121" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">JAYAPURA</text>

  <!-- DLH Label at Bottom -->
  <text x="100" y="190" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#ffffff" stroke="#15803d" stroke-width="1.5" text-anchor="middle" letter-spacing="2">DLH</text>
</svg>
